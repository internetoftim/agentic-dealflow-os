name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  live:
    name: Live endpoint regression (production)
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Edge functions are redeployed from the GitHub sync a minute or two after
      # a push. Give that time to land so the suite tests this commit, not the
      # previous deploy (a new endpoint would otherwise 404 here).
      - name: Wait for the edge-function deploy
        if: github.event_name == 'push'
        run: sleep 180
      - run: npm run test:live
