name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: api-project-845824049229

      - name: Pull secrets from Secret Manager
        run: |
          OPENAI_API_KEY=$(gcloud secrets versions access latest --secret=OPENAI_API_KEY --project=api-project-845824049229)
          SERVICE_API_KEY=$(gcloud secrets versions access latest --secret=SERVICE_API_KEY --project=api-project-845824049229 2>/dev/null || echo "")
          cat > backend/docsend_capture_service/.env <<EOF
          OPENAI_API_KEY=${OPENAI_API_KEY}
          AG2_MODEL=gpt-4o-mini
          SERVICE_API_KEY=${SERVICE_API_KEY}
          EOF

      - name: Deploy
        run: chmod +x deploy.sh && ./deploy.sh
